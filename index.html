<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#eef1e8">
    <title>L’aventure — calendrier des énigmes</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://accounts.google.com/gsi/client" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <header class="intro">
        <p class="eyebrow">Jeu d’aventure</p>
        <h1>À vous de jouer&nbsp;!</h1>
        <label class="month-picker" for="month-picker">
          Choisir un mois
          <input id="month-picker" type="month">
        </label>
        <button class="admin-toggle" id="admin-toggle" type="button" aria-expanded="false" aria-controls="admin-panel">
          Administration
        </button>
      </header>

      <section class="admin-panel" id="admin-panel" aria-labelledby="admin-title" hidden>
        <h2 id="admin-title">Administration du calendrier</h2>
        <p class="admin-status" id="admin-status" role="status">Connecte-toi avec le compte Google administrateur.</p>
        <button class="admin-button" id="google-sign-in" type="button">Se connecter avec Google</button>
        <div class="admin-editor" id="admin-editor" hidden>
          <button class="admin-button secondary" id="google-sign-out" type="button">Déconnexion</button>
          <div class="drive-folder-setup" id="drive-folder-setup" hidden>
            <p>Crée un dossier Drive dédié. Son contenu sera lisible par les visiteurs du calendrier.</p>
            <button class="admin-button" id="create-drive-folder" type="button">Créer le dossier public</button>
            <div class="drive-folder-result" id="drive-folder-result" hidden>
              <p>Ajoute ces identifiants dans <code>google-config.js</code>, puis redéploie le site :</p>
              <pre id="drive-folder-config"></pre>
              <button class="admin-button secondary" id="copy-drive-folder" type="button">Copier</button>
            </div>
          </div>
          <div class="drive-asset-controls" id="drive-asset-controls" hidden>
            <div class="admin-toolbar">
              <label for="admin-month">Mois à modifier</label>
              <input id="admin-month" type="month">
            </div>
            <div class="admin-upload">
              <label for="background-file">Image de fond du mois</label>
              <input id="background-file" type="file" accept="image/png,image/jpeg,image/webp">
              <div class="admin-actions">
                <button class="admin-button" id="upload-background" type="button">Enregistrer le fond</button>
                <button class="admin-button secondary" id="delete-background" type="button">Supprimer le fond</button>
              </div>
            </div>
            <form class="admin-upload" id="case-upload-form">
              <label for="case-number">Image PNG d’une case</label>
              <div class="case-upload-fields">
                <input id="case-number" type="number" min="1" max="31" value="1" required>
                <input id="case-file" type="file" accept="image/png" required>
              </div>
              <div class="admin-actions">
                <button class="admin-button" type="submit">Enregistrer la case</button>
                <button class="admin-button secondary" id="delete-case" type="button">Supprimer cette image</button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <p class="calendar-status" id="calendar-status" role="status" hidden></p>

      <section class="board-section" aria-label="Plateau de jeu">
        <div class="board" id="board">
          <img class="board-image" src="fond-calendrier.svg" alt="" aria-hidden="true">
          <h2 class="calendar-title" id="calendar-title"></h2>
          <div class="calendar-grid" id="calendar-grid" role="group" aria-labelledby="calendar-title"></div>
        </div>
      </section>

    </main>

    <div class="modal" id="modal" hidden>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="close-button" id="close-button" type="button" aria-label="Fermer l’énigme">
          <span aria-hidden="true">&times;</span>
        </button>
        <h2 class="modal-title" id="modal-title"></h2>
        <div class="image-frame">
          <img class="enigma-image" id="enigma-image" alt="">
          <p class="modal-message" id="modal-message" role="status" hidden></p>
        </div>
      </div>
    </div>
  </body>
</html>
