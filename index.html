<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#eef1e8">
    <title>L’aventure — calendrier des énigmes</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://accounts.google.com/gsi/client" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <nav class="site-nav" aria-label="Navigation principale">
      <a class="site-brand" href="index.html">À vous de jouer&nbsp;!</a>
      <div class="site-nav-links">
        <a class="site-nav-link active" href="index.html" aria-current="page">Calendrier</a>
        <a class="site-nav-link" href="admin.html">Administration</a>
      </div>
    </nav>

    <main>
      <header class="intro">
        <p class="eyebrow">Jeu d’aventure</p>
        <h1>À vous de jouer&nbsp;!</h1>
        <div class="month-picker" role="group" aria-label="Choisir le mois du calendrier">
          <button class="month-nav-button" id="previous-month" type="button" aria-label="Mois précédent">‹</button>
          <span class="month-picker-label" id="month-picker-label" aria-live="polite"></span>
          <button class="month-nav-button" id="next-month" type="button" aria-label="Mois suivant">›</button>
          <button class="month-current-button" id="current-month" type="button">Aujourd’hui</button>
        </div>
      </header>

      <p class="calendar-status" id="calendar-status" role="status" hidden></p>

      <section class="board-section" aria-label="Plateau de jeu">
        <div class="board" id="board">
          <img class="board-image" src="fond-calendrier.svg" alt="" aria-hidden="true">
          <h2 class="calendar-title" id="calendar-title"></h2>
          <div class="calendar-grid" id="calendar-grid" role="group" aria-labelledby="calendar-title"></div>
        </div>
      </section>

    </main>

    <div class="modal" id="modal" hidden>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="close-button" id="close-button" type="button" aria-label="Fermer l’énigme">
          <span aria-hidden="true">&times;</span>
        </button>
        <h2 class="modal-title" id="modal-title"></h2>
        <div class="image-frame">
          <img class="enigma-image" id="enigma-image" alt="">
          <p class="modal-message" id="modal-message" role="status" hidden></p>
        </div>
      </div>
    </div>
  </body>
</html>
